log stderr all;
router id 192.0.2.2;
ipv6 table base { trie on; };
flow6 table flows;
protocol device {}
protocol bgp originator {
  local 127.0.0.2 port 11792 as 64512;
  neighbor 127.0.0.1 port 11791 as 64512;
  multihop 2;
  connect delay time 1;
  connect retry time 1;
  flow6 {
    table flows;
    import all;
    export none;
    validate on;
    base table base;
  };
}
