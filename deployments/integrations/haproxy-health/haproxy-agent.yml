# gobfd-haproxy-agent configuration.
#
# Maps BFD peers to HAProxy agent-check TCP ports.
# HAProxy connects to these ports and reads "up ready\n" or "down\n".

gobfd_addr: "http://127.0.0.1:50052"

# HAProxy reaches the agent through agent-addr on the lab network; the
# default is loopback because agent-check has no authentication.
listen_addr: "0.0.0.0"

backends:
  - peer: "172.23.0.30"
    agent_port: 9990
  - peer: "172.23.0.40"
    agent_port: 9991
