# CVE-2026-112112: empty iBGP AS_PATH must not bypass the destination guard.
log "/tmp/originator.log" all;
router id 192.0.2.1;
flow6 table flows;
protocol device {}
protocol static vectors {
  flow6 { table flows; };
  route flow6 { dst 2001:db8:1::/64; };
  route flow6 { dst 2001:db8:2::/64 offset 8; };
  route flow6 { src 2001:db8:3::/64; };
}
protocol bgp validator {
  local 127.0.0.1 port 11791 as 64512;
  neighbor 127.0.0.2 port 11792 as 64512;
  multihop 2;
  connect delay time 1;
  connect retry time 1;
  flow6 { table flows; import none; export all; };
}
