# GoBFD configuration for interoperability testing.
#
# BFD sessions are configured:
#   1. FRR peer at 172.20.0.20 (Simple Password, 128-byte UDP payload)
#   2. BIRD3 peer at 172.20.0.30 (Keyed SHA1, 128-byte UDP payload)
#   3. Holo peer at 172.20.0.50 (single-hop, 300ms intervals, detect-mult 3)
#   4. Thoro/bfd peer at 172.20.0.60 (single-hop, 300ms intervals, detect-mult 3, no auth)
#
# Detection time = detect_mult * max(RequiredMinRxInterval, RemoteDesiredMinTxInterval)
#                = 3 * 300ms = 900ms (RFC 5880 Section 6.8.3)
#
# Note on Thoro/bfd: auth is NOT enabled because Thoro/bfd does not implement
# auth verification on the receive path (returns ErrNotImplemented). It serves
# as a 4th unique BFD peer implementation for protocol conformance testing.
# The public gobfd-interop key is test data only, never a production secret.

grpc:
  addr: "127.0.0.1:50051"

metrics:
  addr: ":9100"
  path: "/metrics"

log:
  level: "debug"
  format: "text"

bfd:
  default_desired_min_tx: "300ms"
  default_required_min_rx: "300ms"
  default_detect_multiplier: 3

sessions:
  - peer: "172.20.0.20"
    local: "172.20.0.10"
    type: single_hop
    desired_min_tx: "300ms"
    required_min_rx: "300ms"
    detect_mult: 3
    padded_pdu_size: 128
    auth:
      type: simple_password
      key_id: 7
      secret: gobfd-interop

  - peer: "172.20.0.30"
    local: "172.20.0.10"
    type: single_hop
    desired_min_tx: "300ms"
    required_min_rx: "300ms"
    detect_mult: 3
    padded_pdu_size: 128
    auth:
      type: keyed_sha1
      key_id: 7
      secret: gobfd-interop

  - peer: "172.20.0.50"
    local: "172.20.0.10"
    type: single_hop
    desired_min_tx: "300ms"
    required_min_rx: "300ms"
    detect_mult: 3

  - peer: "172.20.0.60"
    local: "172.20.0.10"
    type: single_hop
    desired_min_tx: "300ms"
    required_min_rx: "300ms"
    detect_mult: 3
