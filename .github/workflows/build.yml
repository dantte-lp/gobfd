name: Build

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"

      - name: Install uv
        run: .github/scripts/install-uv.sh

      - name: Run tests with coverage
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Check Sonar token
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            echo "mode=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${GITHUB_ACTOR}" = "dependabot[bot]" ]; then
            echo "mode=skip-dependabot" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "SONAR_TOKEN is required for non-Dependabot SonarQube scans" >&2
          exit 1

      - name: SonarQube Scan
        if: steps.sonar-token.outputs.mode == 'run'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube skipped for Dependabot
        if: steps.sonar-token.outputs.mode == 'skip-dependabot'
        run: >
          echo "Skipping SonarQube scan because this run was triggered by Dependabot
          and no Dependabot SONAR_TOKEN secret is available."
