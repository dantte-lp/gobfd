name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: docker.io/library/golang:1.27.0-trixie@sha256:ae28539d2ef595b9a2930dd7f031d9592376829dc0eae7cb869559f7d5812c3a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GIT_COMMIT="${GITHUB_SHA::8}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X github.com/dantte-lp/gobfd/internal/version.Version=${VERSION} \
            -X github.com/dantte-lp/gobfd/internal/version.GitCommit=${GIT_COMMIT} \
            -X github.com/dantte-lp/gobfd/internal/version.BuildDate=${BUILD_DATE}"
          go build -buildvcs=false -ldflags="${LDFLAGS}" ./cmd/gobfd
          go build -buildvcs=false -ldflags="${LDFLAGS}" ./cmd/gobfdctl
          go build -buildvcs=false -ldflags="${LDFLAGS}" ./cmd/gobfd-haproxy-agent
          go build -buildvcs=false -ldflags="${LDFLAGS}" ./cmd/gobfd-exabgp-bridge

      - name: Test
        run: go test -buildvcs=false ./... -race -count=1

      - name: Lint
        run: make lint-ci

      - name: Vulnerability Audit
        run: go run ./scripts/vuln-audit.go

  reports:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    container:
      image: docker.io/library/golang:1.27.0-trixie@sha256:ae28539d2ef595b9a2930dd7f031d9592376829dc0eae7cb869559f7d5812c3a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install report tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends ca-certificates coreutils curl tar
          UV_INSTALL_DIR=/usr/local/bin .github/scripts/install-uv.sh
          uv sync --frozen --no-build --no-default-groups --group quality

      - name: Run tests with JUnit output
        run: |
          mkdir -p reports/tests
          go tool -modfile=tools/go.mod gotestsum \
            --junitfile reports/tests/unit-report.xml \
            --jsonfile reports/tests/unit-report.json \
            --format short-verbose \
            -- -buildvcs=false ./... -race -count=1
          uv run --frozen --no-build --no-default-groups --group quality -- \
            junit2html reports/tests/unit-report.xml reports/tests/unit-report.html

      - name: Run benchmarks
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p reports/benchmarks "testdata/benchmarks/${VERSION}"
          go test -buildvcs=false -bench=. -benchmem -count=6 -run='^$' -timeout=120s \
            ./internal/bfd/ | tee "testdata/benchmarks/${VERSION}/benchmark-bfd.txt"
          go test -buildvcs=false -bench=. -benchmem -count=6 -run='^$' -timeout=120s \
            ./internal/netio/ | tee "testdata/benchmarks/${VERSION}/benchmark-netio.txt"
          cat "testdata/benchmarks/${VERSION}/benchmark-bfd.txt" \
              "testdata/benchmarks/${VERSION}/benchmark-netio.txt" \
              > "testdata/benchmarks/${VERSION}/benchmark.txt"

      - name: Generate benchmark metadata
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          printf '{"version":"%s","commit":"%s","date":"%s","go":"%s","count":6}\n' \
            "${VERSION}" "${GITHUB_SHA::8}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$(go env GOVERSION)" \
            > "testdata/benchmarks/${VERSION}/meta.json"

      - name: Compare with baseline
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -f testdata/benchmarks/baseline.txt ]; then
            go tool -modfile=tools/go.mod benchstat testdata/benchmarks/baseline.txt \
              "testdata/benchmarks/${VERSION}/benchmark.txt" \
              | tee reports/benchmarks/comparison-vs-baseline.txt
            {
              echo '<!DOCTYPE html><html><head><meta charset="utf-8">'
              echo '<title>GoBFD Benchmark Comparison: baseline vs '"${VERSION}"'</title>'
              echo '<style>body{font-family:system-ui;margin:2em;background:#1a1a2e;color:#e0e0e0}'
              echo 'h1{color:#00d4ff}pre{background:#16213e;padding:1.5em;border-radius:8px;'
              echo 'font-size:14px;line-height:1.6;border:1px solid #0f3460}'
              echo '.meta{color:#888;font-size:13px}</style></head><body>'
              echo '<h1>GoBFD Benchmark Comparison</h1>'
              echo '<p class="meta">baseline vs '"${VERSION}"' &mdash; '"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'</p><pre>'
              cat reports/benchmarks/comparison-vs-baseline.txt
              echo '</pre></body></html>'
            } > reports/benchmarks/comparison-vs-baseline.html
          fi

      - name: Create reports archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cp "testdata/benchmarks/${VERSION}"/*.txt reports/benchmarks/ 2>/dev/null || true
          cp "testdata/benchmarks/${VERSION}/meta.json" reports/benchmarks/ 2>/dev/null || true
          tar -czf "gobfd-${VERSION}-reports.tar.gz" reports/

      - name: Upload reports archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reports
          path: gobfd-*-reports.tar.gz
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    needs: [test, reports]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"

      - name: Refuse existing release, draft, or versioned OCI tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [ -z "$repository_owner" ] || [ -z "$repository_name" ] || \
            [ "$repository_name" = "$GITHUB_REPOSITORY" ] || \
            [[ "$repository_name" == */* ]]; then
            echo "invalid GITHUB_REPOSITORY: $GITHUB_REPOSITORY" >&2
            exit 1
          fi

          # GraphQL variable references must remain literal for the API.
          # shellcheck disable=SC2016
          release_query="$(gh api graphql \
            -f query='
              query($owner: String!, $name: String!, $tag: String!) {
                repository(owner: $owner, name: $name) {
                  release(tagName: $tag) {
                    id
                    isDraft
                    tagName
                  }
                }
              }
            ' \
            -F owner="$repository_owner" \
            -F name="$repository_name" \
            -F tag="$GITHUB_REF_NAME")"
          jq -e '
            (.errors? == null) or
            ((.errors | type) == "array" and (.errors | length) == 0)
          ' <<<"$release_query" >/dev/null
          jq -e '.data.repository | type == "object"' \
            <<<"$release_query" >/dev/null
          jq -e '.data.repository | has("release")' \
            <<<"$release_query" >/dev/null
          release_state="$(jq -er '
            if .data.repository.release == null then "absent" else "exists" end
          ' <<<"$release_query")"
          if [ "$release_state" != "absent" ]; then
            echo "release or draft already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          package_versions="$RUNNER_TEMP/ghcr-package-versions.json"
          existing_tags="$RUNNER_TEMP/ghcr-existing-tags.txt"
          gh api --paginate \
            '/users/dantte-lp/packages/container/gobfd/versions?per_page=100' \
            --slurp >"$package_versions"
          jq -r 'flatten | .[].metadata.container.tags[]?' "$package_versions" \
            | LC_ALL=C sort -u >"$existing_tags"

          version="${GITHUB_REF_NAME#v}"
          for tag in \
            "$version" \
            "$version-debian-trixie" \
            "$version-oraclelinux10"; do
            if grep -Fxq -- "$tag" "$existing_tags"; then
              echo "versioned OCI tag already exists: $tag" >&2
              exit 1
            fi
          done

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          if ! awk -v ver="$VERSION" '
            BEGIN { prefix = "## [" ver "] - " }
            /^## \[/ {
              if (found) exit
              date = substr($0, length(prefix) + 1)
              if (index($0, prefix) == 1 && length(date) == 10 &&
                  date ~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/) {
                found = 1
              }
              next
            }
            /^\[.+\]:/ && found { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md >release-notes.md; then
            echo "No exact dated CHANGELOG.md section for version $VERSION." >&2
            exit 1
          fi

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "Dated CHANGELOG.md section for version $VERSION is empty." >&2
            exit 1
          fi

          echo "--- Release notes for $VERSION ---"
          cat release-notes.md

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      - name: Add Syft to PATH
        run: |
          mkdir -p "$RUNNER_TEMP/syft-bin"
          ln -sf "${{ steps.syft.outputs.cmd }}" "$RUNNER_TEMP/syft-bin/syft"
          echo "$RUNNER_TEMP/syft-bin" >> "$GITHUB_PATH"

      - name: Verify UPX prerequisite
        env:
          UPX_VERSION: "4.2.2"
        run: |
          set -euo pipefail

          if ! upx_output="$(upx --version 2>&1)"; then
            echo "UPX prerequisite failed; expected upx $UPX_VERSION" >&2
            echo "actual: ${upx_output:-command unavailable}" >&2
            exit 1
          fi
          upx_first_line="${upx_output%%$'\n'*}"
          actual_tool=""
          actual_version=""
          extra_token=""
          read -r actual_tool actual_version extra_token <<<"$upx_first_line"
          if [ "$actual_tool" != "upx" ] || \
            [ "$actual_version" != "$UPX_VERSION" ] || \
            [ -n "$extra_token" ]; then
            echo "UPX prerequisite failed; expected first line: upx $UPX_VERSION" >&2
            echo "actual first line: ${upx_first_line:-<empty>}" >&2
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean --parallelism=1 --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record exact release commit, assets, and OCI evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          expected_commit="$(git rev-parse HEAD)"
          tag_ref="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          tag_type="$(jq -er '.object.type | select(type == "string" and length > 0)' \
            <<<"$tag_ref")"
          tag_sha="$(jq -er '.object.sha | select(type == "string" and length > 0)' \
            <<<"$tag_ref")"
          if [ "$tag_type" = "tag" ]; then
            tag_object="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")"
            tag_type="$(jq -er '.object.type | select(type == "string" and length > 0)' \
              <<<"$tag_object")"
            tag_sha="$(jq -er '.object.sha | select(type == "string" and length > 0)' \
              <<<"$tag_object")"
          fi
          if [ "$tag_type" != "commit" ] || [ "$tag_sha" != "$expected_commit" ]; then
            echo "tag does not resolve to the checked-out release commit" >&2
            exit 1
          fi
          printf '%s\n' "$expected_commit" \
            >"$RUNNER_TEMP/expected-release-commit.txt"

          jq -e '
            type == "array" and
            (any(.[]; .type == "Archive")) and
            (any(.[]; .type == "Linux Package")) and
            (any(.[]; .type == "Checksum")) and
            (any(.[]; .type == "SBOM")) and
            ([.[] |
              select(.type == "Archive" or .type == "Linux Package" or
                .type == "Checksum" or .type == "SBOM") |
              .path] as $paths |
              ($paths | length > 0) and
              ($paths | all(type == "string" and length > 0)))
          ' dist/artifacts.json >/dev/null
          jq -r '
            .[] |
            select(.type == "Archive" or .type == "Linux Package" or
              .type == "Checksum" or .type == "SBOM") |
            .path | split("/")[-1]
          ' dist/artifacts.json >"$RUNNER_TEMP/expected-release-assets.txt"
          printf 'gobfd-%s-reports.tar.gz\nrelease-image-digests.txt\n' \
            "$GITHUB_REF_NAME" >>"$RUNNER_TEMP/expected-release-assets.txt"
          LC_ALL=C sort -u -o "$RUNNER_TEMP/expected-release-assets.txt" \
            "$RUNNER_TEMP/expected-release-assets.txt"

          printf 'linux/amd64\nlinux/arm64\n' \
            >"$RUNNER_TEMP/expected-release-platforms.txt"
          : >release-image-digests.txt
          image_index=0
          version="${GITHUB_REF_NAME#v}"
          for image in \
            "ghcr.io/dantte-lp/gobfd:${version}-debian-trixie" \
            "ghcr.io/dantte-lp/gobfd:${version}-oraclelinux10"; do
            raw_manifest="$RUNNER_TEMP/release-image-${image_index}.json"
            actual_platforms="$RUNNER_TEMP/release-platforms-${image_index}.txt"
            docker buildx imagetools inspect --raw "$image" >"$raw_manifest"
            jq -er '
              .manifests[] |
              select(.annotations["vnd.docker.reference.type"] !=
                "attestation-manifest") |
              "\(.platform.os)/\(.platform.architecture)"
            ' "$raw_manifest" | LC_ALL=C sort >"$actual_platforms"
            diff -u "$RUNNER_TEMP/expected-release-platforms.txt" \
              "$actual_platforms"
            image_digest="$(sha256sum "$raw_manifest")"
            image_digest="${image_digest%% *}"
            printf '%s sha256:%s\n' "$image" "$image_digest" \
              >>release-image-digests.txt
            image_index=$((image_index + 1))
          done
          receipt_shape="$(awk 'NF { nonempty++ } END { print NR ":" nonempty + 0 }' \
            release-image-digests.txt)"
          if [ "$receipt_shape" != "2:2" ]; then
            echo "OCI digest receipt must contain exactly two nonempty lines" >&2
            exit 1
          fi

      - name: Download reports archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-reports

      - name: Attach reports to release
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            gobfd-*-reports.tar.gz release-image-digests.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          expected_commit="$(cat "$RUNNER_TEMP/expected-release-commit.txt")"
          if [ "$(git rev-parse HEAD)" != "$expected_commit" ]; then
            echo "checked-out commit changed after release evidence was recorded" >&2
            exit 1
          fi
          tag_ref="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          tag_type="$(jq -er '.object.type | select(type == "string" and length > 0)' \
            <<<"$tag_ref")"
          tag_sha="$(jq -er '.object.sha | select(type == "string" and length > 0)' \
            <<<"$tag_ref")"
          if [ "$tag_type" = "tag" ]; then
            tag_object="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")"
            tag_type="$(jq -er '.object.type | select(type == "string" and length > 0)' \
              <<<"$tag_object")"
            tag_sha="$(jq -er '.object.sha | select(type == "string" and length > 0)' \
              <<<"$tag_object")"
          fi
          if [ "$tag_type" != "commit" ] || [ "$tag_sha" != "$expected_commit" ]; then
            echo "tag no longer resolves to the verified release commit" >&2
            exit 1
          fi

          printf 'linux/amd64\nlinux/arm64\n' \
            >"$RUNNER_TEMP/verified-release-platforms.txt"
          : >"$RUNNER_TEMP/verified-release-image-digests.txt"
          image_index=0
          version="${GITHUB_REF_NAME#v}"
          for image in \
            "ghcr.io/dantte-lp/gobfd:${version}-debian-trixie" \
            "ghcr.io/dantte-lp/gobfd:${version}-oraclelinux10"; do
            raw_manifest="$RUNNER_TEMP/verified-release-image-${image_index}.json"
            actual_platforms="$RUNNER_TEMP/verified-release-platforms-${image_index}.txt"
            docker buildx imagetools inspect --raw "$image" >"$raw_manifest"
            jq -er '
              .manifests[] |
              select(.annotations["vnd.docker.reference.type"] !=
                "attestation-manifest") |
              "\(.platform.os)/\(.platform.architecture)"
            ' "$raw_manifest" | LC_ALL=C sort >"$actual_platforms"
            diff -u "$RUNNER_TEMP/verified-release-platforms.txt" \
              "$actual_platforms"
            image_digest="$(sha256sum "$raw_manifest")"
            image_digest="${image_digest%% *}"
            printf '%s sha256:%s\n' "$image" "$image_digest" \
              >>"$RUNNER_TEMP/verified-release-image-digests.txt"
            image_index=$((image_index + 1))
          done
          diff -u release-image-digests.txt \
            "$RUNNER_TEMP/verified-release-image-digests.txt"

          release_json="$(gh release view "$GITHUB_REF_NAME" \
            --json isDraft,tagName,body,assets)"
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "expected release notes are empty" >&2
            exit 1
          fi
          # Command substitution normalizes trailing newlines on both bodies.
          expected_body="$(cat release-notes.md)"
          actual_body="$(jq -er '.body | select(type == "string")' \
            <<<"$release_json")"
          if [ "$actual_body" != "$expected_body" ]; then
            echo "draft body does not exactly match release-notes.md" >&2
            exit 1
          fi
          jq -e --arg tag "$GITHUB_REF_NAME" '
            .isDraft == true and
            .tagName == $tag and
            (.body | length > 0) and
            ([.assets[].name] | any(endswith(".sbom.json")))
          ' <<<"$release_json"
          jq -r '.assets[].name' <<<"$release_json" | LC_ALL=C sort -u \
            >"$RUNNER_TEMP/actual-release-assets.txt"
          diff -u "$RUNNER_TEMP/expected-release-assets.txt" \
            "$RUNNER_TEMP/actual-release-assets.txt"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
