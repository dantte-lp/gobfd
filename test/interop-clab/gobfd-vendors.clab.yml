# Renderer input for the owned FRR-only Containerlab qualification.
# NOS profiles/configs remain recorded in test/e2e/vendor/profiles.json with
# retained-unavailable disposition; their presence does not permit execution.
# Use the Go lifecycle to start both ext-container nodes by exact owned IDs:
#   make interop-clab-up
#   make interop-clab-bootstrap ARGS=--test-only
#   make interop-clab-down
name: gobfd-vendors

topology:
  nodes:
    clab-gobfd-vendors-gobfd:
      kind: ext-container
    frr:
      kind: ext-container
  links:
    - endpoints: ["clab-gobfd-vendors-gobfd:eth6", "frr:eth1"]
