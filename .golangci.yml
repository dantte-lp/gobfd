version: "2"

run:
  timeout: 10m
  relative-path-mode: gomod
  tests: true

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dantte-lp/gobfd

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      colors: true
  show-stats: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Preserve multiple independent diagnostics on the same source line.
  uniq-by-line: false

linters:
  # Forward-compatible maximum: every maintained linter is enabled unless the
  # exclusion below documents a concrete semantic conflict.
  default: all
  disable:
    # Domain analyzers with zero direct project inputs. Keeping them enabled
    # would inflate the count without analyzing a single GoBFD call site.
    - arangolint
    - clickhouselint
    - ginkgolinter
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - testifylint
    - unqueryvet
    - zerologlint
    # Redundant or semantically conflicting rules.
    - exhaustruct # Conflicts with intentional Go zero-value/options APIs.
    - funcorder # Moving declarations apart harms consumer-locality without finding defects.
    - gocyclo # Duplicates cyclop's metric; gocognit is the retained complexity gate.
    - goheader # The repository has no approved per-file copyright owner/header contract.
    - ireturn # Consumer-defined interfaces and factories are deliberate architecture boundaries.
    - gomodguard # Deprecated in v2.12; gomodguard_v2 is enabled.
    - nlreturn # Cosmetic blank-line policy overlaps gofumpt/whitespace.
    - noinlineerr # Rejects the idiomatic scoped `if err := ...` form.
    - paralleltest # tparallel already checks unsafe parallel use; mandatory parallelism is not always safe.
    - testpackage # White-box tests intentionally exercise unexported protocol hot paths.
    - varnamelen # Short RFC field names (d, p, tx, rx) are domain terminology.
    - wsl # Deprecated in v2.2; retained whitespace checks come from gofumpt/whitespace.
    - wsl_v5 # Cosmetic whitespace policy overlaps gofumpt and obscures semantic diffs.

  settings:
    cyclop:
      max-complexity: 15
      package-average: 0.0
    gocognit:
      min-complexity: 20
    gosec:
      excludes: []
      severity: low
      confidence: low
      config:
        global:
          audit: "true"
          nosec: "true"
          show-ignored: "false"
        G301: "0750"
        G302: "0600"
        G306: "0600"
    govet:
      enable:
        - shadow
        - atomic
        - copylocks
        - loopclosure
        - httpmux
    funlen:
      lines: 60
      statements: 40
    maintidx:
      under: 20
    nakedret:
      max-func-lines: 0
    exhaustive:
      default-signifies-exhaustive: true
    interfacebloat:
      max: 10
    lll:
      line-length: 120
      tab-width: 1
    importas:
      no-unaliased: false
    depguard:
      rules:
        main:
          deny:
            - pkg: "math/rand$"
              desc: "Use crypto/rand or math/rand/v2"
            - pkg: "^log$"
              desc: "Use log/slog"
            - pkg: "io/ioutil"
              desc: "Deprecated in Go 1.16"
            - pkg: "unsafe"
              desc: "Forbidden — network daemon handles untrusted input"
            - pkg: "os/exec"
              desc: "Shell injection risk — not needed in this project"
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      attr-only: false
    loggercheck:
      require-string-key: true
      no-printf-like: true
    mnd:
      # Configuration/default tables legitimately contain values. Require
      # named constants where numbers affect branching or arithmetic instead.
      checks:
        - condition
        - operation
    forbidigo:
      forbid:
        - pattern: '^fmt\.Print(|f|ln)$'
          msg: "Use slog or t.Logf in library code; fmt.Print* is allowed only under cmd/, scripts/, and examples."
        - pattern: '^print(ln)?$'
          msg: "Bootstrap-only builtin; use slog instead."
      exclude-godoc-examples: true
    goconst:
      min-len: 4
      min-occurrences: 5
      match-constant: true
      ignore-string-values:
        - '^(udp|tcp|unix)$'
        - '^(up|down|admin_down|init)$'
        - '^(single_hop|multi_hop)$'
    godox:
      keywords:
        - TODO
        - FIXME
        - HACK
        - XXX
        - BUG
        - OPTIMIZE
    gomodguard_v2:
      blocked:
        - module: github.com/pkg/errors
          recommendations:
            - errors
            - fmt
          reason: Standard library has covered errors.Is / errors.As since Go 1.13.
        - module: io/ioutil
          recommendations:
            - io
            - os
          reason: Deprecated in Go 1.16; use io / os equivalents.
    nestif:
      min-complexity: 5
    embeddedstructfieldcheck:
      forbid-mutex: true
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
  exclusions:
    warn-unused: true
    generated: strict
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - gosec
          - dupl
          - funlen
          - gocognit
          - err113
          - nonamedreturns
          - maintidx
          - containedctx
          - forcetypeassert
          - goconst
          - godox
          - dogsled
          - nestif
          - wrapcheck
      # RFC and encapsulation codecs use specification-defined bit positions,
      # masks, and widths. Naming each literal would obscure the wire layout.
      - path: ^internal/(bfd/(auth|packet|session_packet)|netio/(geneve|overlay_inner|rawsock_linux|vxlan))\.go$
        linters:
          - mnd
      # These exact globals are immutable lookup tables, hot-path pools,
      # Cobra command state, ldflags targets, or test-export bridges. Both path
      # and diagnostic text are bounded so any newly added global still fails.
      - path: ^cmd/gobfdctl/commands/
        text: '^(client|echoClient|microClient|outputFormat|serverAddr|rootCmd|shellCommands) is a global variable'
        linters:
          - gochecknoglobals
      - path: ^internal/bfd/packet\.go$
        text: '^(diagNames|stateNames|authTypeNames|PacketPool) is a global variable'
        linters:
          - gochecknoglobals
      - path: ^internal/config/config\.go$
        text: '^(validMicroBFDActuatorModes|validMicroBFDActuatorBackends) is a global variable'
        linters:
          - gochecknoglobals
      - path: ^internal/config/config\.go$
        text: '^(validMicroBFDActuatorOwnerPolicies|validMicroBFDActuatorActions) is a global variable'
        linters:
          - gochecknoglobals
      - path: ^internal/config/config\.go$
        text: '^(validOverlayBackends|ValidGoBGPStrategies|ValidSessionTypes|ValidAuthTypes) is a global variable'
        linters:
          - gochecknoglobals
      - path: ^internal/netio/overlay_inner\.go$
        text: '^(innerDstMAC|innerSrcMAC) is a global variable'
        linters:
          - gochecknoglobals
      - path: ^internal/server/export_test\.go$
        text: '^(StateToProto|DiagToProto|SessionTypeToProto|SessionTypeFromPB|DurationFromPB) is a global variable'
        linters:
          - gochecknoglobals
      - path: ^internal/server/export_test\.go$
        text: '^(StateChangeToProto|SnapshotToProto|MapManagerError|WrapError) is a global variable'
        linters:
          - gochecknoglobals
      - path: ^internal/version/version\.go$
        text: '^(Version|GitCommit|BuildDate) is a global variable'
        linters:
          - gochecknoglobals
      - path: ^scripts/vuln-audit\.go$
        text: '^allowlist is a global variable'
        linters:
          - gochecknoglobals
      - path: cmd/
        linters:
          - forbidigo
      - path: scripts/
        linters:
          - forbidigo
      # OVS LAG backend shells out to the official ovs-vsctl admin CLI with
      # validated interface names; keep os/exec forbidden everywhere else.
      - path: internal/netio/lag_backend.go
        text: "import 'os/exec' is not allowed"
        linters:
          - depguard
      - path: internal/bfd/packet.go
        text: "Function 'UnmarshalControlPacket' has too many statements"
        linters:
          - funlen

severity:
  # Every enabled diagnostic is blocking and exported as an error in structured
  # reports; no style/security split can silently downgrade a failure.
  default: error
