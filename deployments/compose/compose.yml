services:
  gobfd:
    build:
      context: ../..
      dockerfile: deployments/docker/Containerfile
    container_name: gobfd
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    network_mode: host
    volumes:
      - ../../configs/gobfd.example.yml:/etc/gobfd/gobfd.yml:ro,z
    command: ["-config", "/etc/gobfd/gobfd.yml"]

  prometheus:
    build:
      context: ../../test/interop/prometheus
      dockerfile: Containerfile
    container_name: gobfd-prometheus
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z

  grafana:
    build:
      context: ../../test/interop/grafana
      dockerfile: Containerfile
    container_name: gobfd-grafana
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
