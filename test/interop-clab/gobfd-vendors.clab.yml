# GoBFD vendor BFD interoperability test topology.
#
# Star topology: GoBFD (ext-container) at the center with point-to-point
# IPv4 /30 links and selected IPv6 /127 links to each vendor NOS. Tests
# BFD single-hop (RFC 5881) and BGP-triggered behavior (RFC 5882) against
# commercial/enterprise routing stacks.
#
# Vendor images that are not present are skipped by the Go tests.
# Primary profiles: Arista cEOS, Nokia SR Linux, SONiC-VS, VyOS.
# Baseline profile: FRR. Deferred profile: Cisco XRd.
#
# Renderer input; logical external node names require the Go lifecycle.
# Vendor profiles retain their separate OS-policy and runtime gates.
# Usage from the repository root:
#   make interop-clab-up
#   make interop-clab-bootstrap ARGS=--test-only
#   make interop-clab-down

name: gobfd-vendors

topology:
  nodes:
    # === GoBFD: external container with NET_RAW + NET_ADMIN ===
    # Started by the Go lifecycle before containerlab deploy.
    # For ext-container kind, the node name MUST match the actual container name.
    clab-gobfd-vendors-gobfd:
      kind: ext-container

    # === Arista cEOS (ASN 65002) ===
    # Current profile: single-hop BGP+BFD on Ethernet1.
    # VXLAN/VTEP BFD (bfd vtep evpn) is a future dedicated profile.
    # Image: download from arista.com (free registration)
    # Import: podman import cEOS64-lab-4.36.0.1F.tar ceos:4.36.0.1F
    arista:
      kind: arista_ceos
      image: ceos:4.36.0.1F
      startup-config: arista/startup-config.cfg
      enforce-startup-config: true

    # === Nokia SR Linux (ASN 65003) ===
    # Image: ghcr.io/nokia/srlinux (freely available, no registration)
    nokia:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:25.10.2
      startup-config: nokia/config.cli

    # === Cisco XRd (ASN 65004) ===
    # Use XRd Control Plane for veth-based topologies (supports linux interfaces).
    # XRd vRouter requires PCI passthrough and cannot be used here.
    # CP import: podman load -i xrd-control-plane-container-x64.dockerv1.tgz
    cisco:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:25.4.1
      startup-config: cisco/xrd.cfg

    # === SONiC-VS (ASN 65005) ===
    # Image: podman pull docker.io/netreplica/docker-sonic-vs:latest
    # Or build from Azure pipelines: sonic-build.azurewebsites.net
    sonic:
      kind: sonic-vs
      image: docker.io/netreplica/docker-sonic-vs:latest

    # === VyOS (ASN 65006) ===
    # Official reproducible image path: build from a VyOS Stream/nightly ISO.
    # Public lab mirror used by the Go bootstrap when present: docker.io/muruu1/vyos:latest.
    vyos:
      kind: vyosnetworks_vyos
      image: docker.io/muruu1/vyos:latest
      startup-config: vyos/config.boot

    # === FRRouting (ASN 65007) ===
    # Built from the shared test/interop/frr recipe and started by exact image ID.
    # RFC coverage: 5880 (base), 5881 (single-hop), 5882 (BGP-BFD), 5883 (multihop)
    frr:
      kind: ext-container

  links:
    - endpoints: ["clab-gobfd-vendors-gobfd:eth1", "arista:eth1"]
    - endpoints: ["clab-gobfd-vendors-gobfd:eth2", "nokia:e1-1"]
    - endpoints: ["clab-gobfd-vendors-gobfd:eth3", "cisco:Gi0-0-0-0"]
    - endpoints: ["clab-gobfd-vendors-gobfd:eth4", "sonic:eth1"]
    - endpoints: ["clab-gobfd-vendors-gobfd:eth5", "vyos:eth1"]
    - endpoints: ["clab-gobfd-vendors-gobfd:eth6", "frr:eth1"]
