name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, main, "release/v*"]
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Run tests with coverage
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Check Sonar token
        id: sonar-token
        env:
          SONAR_TOKEN_PRESENT: ${{ secrets.SONAR_TOKEN != '' }}
        run: go run ./test/cmd/cictl sonar-mode

      - name: SonarQube Scan
        if: steps.sonar-token.outputs.mode == 'run'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube skipped for Dependabot
        if: steps.sonar-token.outputs.mode == 'skip-dependabot'
        run: go run ./test/cmd/cictl sonar-skip-notice
