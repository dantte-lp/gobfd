# GoBFD daemon configuration example.
#
# Supported environment overrides:
#   GOBFD_GRPC_ADDR=127.0.0.1:50052
#   GOBFD_METRICS_ADDR=127.0.0.1:9100
#   GOBFD_METRICS_PATH=/metrics
#   GOBFD_LOG_LEVEL=debug
#   GOBFD_LOG_FORMAT=text
#   GOBFD_UNSOLICITED_ENABLED=true
#   GOBFD_ECHO_ENABLED=true
#   GOBFD_SOCKET_READ_BUFFER_SIZE=4194304
#   GOBFD_SOCKET_WRITE_BUFFER_SIZE=4194304
#   GOBFD_VXLAN_ENABLED=true
#   GOBFD_VXLAN_BACKEND=userspace-udp
#   GOBFD_GENEVE_ENABLED=true
#   GOBFD_GENEVE_BACKEND=userspace-udp
#   GOBFD_GOBGP_ENABLED=true
#   GOBFD_GOBGP_ADDR=127.0.0.1:50051
#   GOBFD_GOBGP_STRATEGY=disable-peer
#   GOBFD_GOBGP_TLS_ENABLED=true
#   GOBFD_GOBGP_DAMPENING_ENABLED=true

grpc:
  # Optional TCP listener. Plaintext is loopback only and read-only for
  # anonymous clients unless unsafe_loopback_mutations is set; 50051 is the
  # gobgpd default port.
  # addr: "127.0.0.1:50052"
  # unsafe_loopback_mutations: false
  # mTLS for the TCP listener; required for a non-loopback address. Files are
  # re-read on every handshake.
  # tls:
  #   cert_file: "/etc/gobfd/tls/server.pem"
  #   key_file: "/etc/gobfd/tls/server.key"
  #   client_ca_file: "/etc/gobfd/tls/clients-ca.pem"
  # Optional: only these mTLS identities may mutate; others read.
  # mutating_identities: ["spiffe://example.org/gobfd-ops"]
  #
  # Management API on a Unix socket; requests carry the caller's peer UID as
  # principal. Operators join group gobfd-admin (not gobfd, which can read
  # /etc/gobfd). gobfdctl uses unix:///run/gobfd/gobfd.sock by default.
  socket:
    path: "/run/gobfd/gobfd.sock"
    mode: "0660"
    group: "gobfd-admin"

metrics:
  # Prometheus metrics endpoint. It has no authentication, so it listens on
  # loopback; set a reachable address only on a trusted network.
  addr: "127.0.0.1:9100"
  path: "/metrics"

log:
  # Log level: debug, info, warn, error.
  level: "info"
  # Log format: json, text.
  format: "json"

bfd:
  # Default BFD session parameters (can be overridden per session via gRPC).
  #
  # IMPORTANT: BFD intervals are in microseconds per RFC 5880.
  # Use duration strings for convenience (converted internally).
  default_desired_min_tx: "1s"
  default_required_min_rx: "1s"
  default_detect_multiplier: 3
  # RFC 7419: align timers to nearest common interval (3.3ms, 10ms, 20ms,
  # 50ms, 100ms, 1s) for hardware interop. Default: false.
  # align_intervals: true
  #
  # RFC 9764: pad BFD Control packets to this size and set DF bit for
  # path MTU verification. Valid range: 24-9000. Default: 0 (no padding).
  # default_padded_pdu_size: 128

# RFC 9468: Unsolicited BFD. Auto-creates passive sessions for incoming
# BFD packets from unknown peers. MUST be disabled by default per RFC.
# max_sessions is required (>= 1). A source must belong to the subnet of the
# local address that received the packet; allowed_prefixes narrows it further.
#
# unsolicited:
#   enabled: true
#   max_sessions: 10
#   cleanup_timeout: "30s"
#   session_defaults:
#     desired_min_tx: "300ms"
#     required_min_rx: "300ms"
#     detect_mult: 3
#   interfaces:
#     "":
#       enabled: true
#       allowed_prefixes: ["10.0.0.0/8"]
#   # Optional RFC 9468 Section 6.2 authentication; only meticulous_keyed_sha1.
#   auth:
#     type: "meticulous_keyed_sha1"
#     key_id: 1
#     secret: "change-me"

# RFC 9747: Unaffiliated BFD Echo. Detects forwarding-path failures
# without requiring the remote to run BFD. Uses UDP port 3785.
#
# echo:
#   enabled: true
#   default_tx_interval: "100ms"
#   default_detect_multiplier: 3
#   peers:
#     - peer: "10.0.0.1"
#       local: "10.0.0.2"
#       interface: "eth0"
#       tx_interval: "50ms"
#       detect_mult: 5

# RFC 7130: Micro-BFD for LAG. Runs independent BFD sessions on each
# LAG member link for per-link forwarding verification. Uses UDP port 6784.
# The actuator is disabled by default. Dry-run mode plans member remove/add
# actions without changing the host. Enforce mode supports explicit
# backend: "kernel-bond" or native OVSDB backend: "ovs" with
# owner_policy: "allow-external"; backend: "networkmanager" requires
# owner_policy: "networkmanager-dbus".
#
# micro_bfd:
#   actuator:
#     mode: "dry-run"
#     backend: "kernel-bond"
#     ovsdb_endpoint: ""
#     owner_policy: "refuse-if-managed"
#     down_action: "remove-member"
#     up_action: "add-member"
#   groups:
#     - lag_interface: "bond0"
#       member_links: ["eth0", "eth1"]
#       peer_addr: "10.0.0.2"
#       local_addr: "10.0.0.1"
#       desired_min_tx: "100ms"
#       required_min_rx: "100ms"
#       detect_mult: 3
#       min_active_links: 1

# RFC 8971: BFD for VXLAN. Runs BFD sessions encapsulated in VXLAN
# to verify VTEP-to-VTEP forwarding paths. Uses UDP port 4789.
# The userspace VXLAN socket must not conflict with kernel VXLAN, OVS, Cilium,
# or another dataplane already bound to the same local address/namespace.
#
# vxlan:
#   enabled: true
#   # Only "userspace-udp" is implemented today. Reserved future backends:
#   # "kernel", "ovs", "ovn", "cilium", "calico", "nsx".
#   backend: "userspace-udp"
#   management_vni: 16777215
#   default_desired_min_tx: "1s"
#   default_required_min_rx: "1s"
#   default_detect_multiplier: 3
#   peers:
#     - peer: "10.0.0.2"
#       local: "10.0.0.1"
#       peer_mac: "02:00:00:00:00:02"
#       local_mac: "02:00:00:00:00:01"
#       desired_min_tx: "300ms"
#       required_min_rx: "300ms"
#       detect_mult: 5

# RFC 9521: BFD for Geneve. Runs BFD sessions encapsulated in Geneve
# to verify NVE-to-NVE forwarding paths. Uses UDP port 6081.
# The userspace Geneve socket must not conflict with kernel Geneve, OVS/OVN,
# NSX, or another dataplane already bound to the same local address/namespace.
#
# geneve:
#   enabled: true
#   # Only "userspace-udp" is implemented today. Reserved future backends:
#   # "kernel", "ovs", "ovn", "cilium", "calico", "nsx".
#   backend: "userspace-udp"
#   default_vni: 100
#   default_desired_min_tx: "1s"
#   default_required_min_rx: "1s"
#   default_detect_multiplier: 3
#   peers:
#     - peer: "10.0.0.2"
#       local: "10.0.0.1"
#       vni: 200
#       inner_peer: "192.0.2.2"
#       inner_local: "192.0.2.1"
#       peer_mac: "02:00:00:00:00:02"
#       local_mac: "02:00:00:00:00:01"
#       desired_min_tx: "300ms"
#       required_min_rx: "300ms"
#       detect_mult: 5

# GoBGP integration (RFC 5882 Section 10.2).
# When enabled, BFD state changes are propagated to a GoBGP instance
# via its gRPC API. BFD Down triggers BGP peer disable; BFD Up re-enables.
#
# gobgp:
#   enabled: true
#   # GoBGP gRPC API address (gobgpd default port 50051).
#   addr: "127.0.0.1:50051"
#   # Only "disable-peer" is implemented; "withdraw-routes" is rejected.
#   strategy: "disable-peer"
#   # Flap dampening (GoBFD policy; RFC 5882 Section 3.1 hysteresis): every
#   # BFD Down disables the peer at once; past suppress_threshold only the
#   # re-enable on BFD Up is held until reuse_threshold or max_suppress_time.
#   dampening:
#     enabled: false
#     suppress_threshold: 3
#     reuse_threshold: 2
#     max_suppress_time: "60s"
#     half_life: "15s"

# Declarative BFD sessions. Sessions defined here are created on startup
# and reconciled on SIGHUP reload within listener bindings opened at startup
# (new sessions added only on an existing binding, removed sessions
# destroyed, existing sessions left untouched).
#
# sessions:
#   - peer: "10.0.0.1"
#     local: "10.0.0.2"
#     interface: "eth0"
#     type: single_hop
#     desired_min_tx: "100ms"
#     required_min_rx: "100ms"
#     detect_mult: 3
#     auth:
#       # RFC 5880 Section 6.7 authentication. Supported values:
#       # simple_password, keyed_md5, meticulous_keyed_md5,
#       # keyed_sha1, meticulous_keyed_sha1.
#       type: keyed_sha1
#       key_id: 7
#       secret: "change-me"
#     # RFC 9764: per-session padded PDU size. Overrides bfd.default_padded_pdu_size.
#     # padded_pdu_size: 128
#   - peer: "10.0.1.1"
#     local: "10.0.1.2"
#     type: multi_hop
#     desired_min_tx: "300ms"
#     required_min_rx: "300ms"
#     detect_mult: 5
