name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/golang:1.27.0-trixie@sha256:ae28539d2ef595b9a2930dd7f031d9592376829dc0eae7cb869559f7d5812c3a
    env:
      PODMAN_COMPOSE_PROVIDER: /usr/local/bin/docker-compose
      PODMAN_COMPOSE_WARNING_LOGS: "false"
      DOCKER_BUILDKIT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Build
        shell: bash
        run: |
          VERSION="ci-${GITHUB_SHA::8}"
          GIT_COMMIT="${GITHUB_SHA::8}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X github.com/dantte-lp/gobfd/internal/version.Version=${VERSION} \
            -X github.com/dantte-lp/gobfd/internal/version.GitCommit=${GIT_COMMIT} \
            -X github.com/dantte-lp/gobfd/internal/version.BuildDate=${BUILD_DATE}"
          install -d -m 0755 /tmp/gobfd-build
          go build -buildvcs=false -ldflags="${LDFLAGS}" -o /tmp/gobfd-build/gobfd ./cmd/gobfd
          go build -buildvcs=false -ldflags="${LDFLAGS}" -o /tmp/gobfd-build/gobfdctl ./cmd/gobfdctl
          go build -buildvcs=false -ldflags="${LDFLAGS}" -o /tmp/gobfd-build/gobfd-haproxy-agent ./cmd/gobfd-haproxy-agent
          go build -buildvcs=false -ldflags="${LDFLAGS}" -o /tmp/gobfd-build/gobfd-exabgp-bridge ./cmd/gobfd-exabgp-bridge

      - name: Install test tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends ca-certificates coreutils curl jq podman tar
          COMPOSE_INSTALL_DIR=/usr/local/bin scripts/install-compose-provider.sh
          podman compose version
          UV_INSTALL_DIR=/usr/local/bin .github/scripts/install-uv.sh
          uv sync --frozen --no-default-groups --group quality

      - name: Test with coverage
        run: |
          go tool -modfile=tools/go.mod gotestsum \
            --junitfile unit-report.xml \
            --jsonfile unit-report.json \
            --format short-verbose \
            -- -buildvcs=false ./... -race -count=1 \
               -coverprofile=coverage.out -covermode=atomic

      - name: Generate HTML test report
        if: always()
        run: >-
          uv run --frozen --no-default-groups --group quality --
          junit2html unit-report.xml unit-report.html 2>/dev/null || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            unit-report.xml
            unit-report.json
            unit-report.html
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  non-linux-contract:
    name: Non-Linux transport contract
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"

      - name: Test the non-Linux transport boundary
        run: go test ./internal/netio -race -count=1

      - name: Cross-compile all packages without cgo
        env:
          CGO_ENABLED: "0"
        run: go build ./...

  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/golang:1.27.0-trixie@sha256:ae28539d2ef595b9a2930dd7f031d9592376829dc0eae7cb869559f7d5812c3a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: golangci-lint v2
        run: make lint-ci

  lint-docs:
    name: Lint (docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"

      - name: Install documentation linters
        run: |
          .github/scripts/install-uv.sh
          "$HOME/.local/bin/uv" sync --frozen --no-default-groups --group quality

      - name: Markdown policy
        run: go run ./test/cmd/repoquality markdown --root .

      - name: yamllint
        run: >-
          uv run --frozen --no-default-groups --group quality --
          yamllint -c .yamllint.yaml .

      - name: Python quality and security
        run: make python-check

      - name: codespell
        run: >
          uv run --frozen --no-default-groups --group quality -- codespell
          README.md CONTRIBUTING.md CHANGELOG.md
          CODE_OF_CONDUCT.md SUPPORT.md GOVERNANCE.md MAINTAINERS.md
          docs/en/implementation-plan.md docs/en/codebase-consistency-audit.md

  commit-policy:
    name: Commit policy (PR title)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: go run ./test/cmd/repoquality commit --message "$PR_TITLE"

  vulnerability-check:
    name: Vulnerability audit
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/golang:1.27.0-trixie@sha256:ae28539d2ef595b9a2930dd7f031d9592376829dc0eae7cb869559f7d5812c3a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Vulnerability Audit
        run: |
          mkdir -p reports/security
          go run ./scripts/vuln-audit.go --report-dir reports/security

      - name: Generate separate runtime and tools SBOMs
        if: always()
        run: |
          go run github.com/anchore/syft/cmd/syft@v1.51.0 scan file:go.mod \
            --override-default-catalogers go-module-file-cataloger \
            --quiet --output cyclonedx-json=reports/security/runtime-sbom.cdx.json
          go run github.com/anchore/syft/cmd/syft@v1.51.0 scan file:tools/go.mod \
            --override-default-catalogers go-module-file-cataloger \
            --quiet --output cyclonedx-json=reports/security/tools-sbom.cdx.json
          test -s reports/security/runtime-sbom.cdx.json
          test -s reports/security/tools-sbom.cdx.json

      - name: Upload dependency security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-security-reports
          path: reports/security/
          retention-days: 30

  buf:
    name: Buf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"

      - name: Set up buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true

      - name: buf lint
        run: buf lint

      - name: Verify generated protobuf code
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
          buf generate
          git diff --exit-code -- pkg/bfdpb

      - name: Fetch base branch for buf breaking
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=origin/${{ github.event.pull_request.base.ref }}'

  benchmark:
    name: Benchmark comparison
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      BENCH_REGEX: >-
        ^(BenchmarkControlPacket|BenchmarkFSMTransition|BenchmarkApplyJitter|BenchmarkPacketPool|BenchmarkRecvStateToEvent|BenchmarkFullRecvPath|BenchmarkFullRecvPathCodec|BenchmarkFullTxPath|BenchmarkSessionRecvPacket|BenchmarkDetectionTimeCalc|BenchmarkCalcTxInterval|BenchmarkDetectionTimeCalcHot|BenchmarkCalcTxIntervalHot|BenchmarkSessionApplyJitter|BenchmarkBuildInnerPacket|BenchmarkStripInnerPacket|BenchmarkVXLANHeader|BenchmarkGeneveHeader)
    container:
      image: docker.io/library/golang:1.27.0-trixie@sha256:ae28539d2ef595b9a2930dd7f031d9592376829dc0eae7cb869559f7d5812c3a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Run benchmarks (PR)
        run: >
          go test -buildvcs=false -bench="$BENCH_REGEX" -benchmem -count=6 -run='^$'
          -timeout=120s ./internal/bfd/ ./internal/netio/ > new.txt

      - name: Create base branch worktree
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git worktree add --detach ../gobfd-base origin/${{ github.event.pull_request.base.ref }}

      - name: Run benchmarks (base)
        run: |
          (
            cd ../gobfd-base
            go test -buildvcs=false -bench="$BENCH_REGEX" -benchmem -count=6 -run='^$' \
              -timeout=120s ./internal/bfd/ ./internal/netio/
          ) > old.txt

      - name: Compare benchmarks
        run: |
          echo "## Benchmark comparison" > bench-report.md
          echo '```' >> bench-report.md
          go tool -modfile=tools/go.mod benchstat old.txt new.txt >> bench-report.md 2>&1 || true
          echo '```' >> bench-report.md
          cat bench-report.md

      - name: Generate HTML comparison
        run: |
          {
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Benchmark Comparison</title>'
            echo '<style>body{font-family:system-ui;margin:2em;background:#1a1a2e;color:#e0e0e0}'
            echo 'pre{background:#16213e;padding:1.5em;border-radius:8px;font-size:14px;line-height:1.6;border:1px solid #0f3460}</style>'
            echo '</head><body><h1 style="color:#00d4ff">Benchmark Comparison</h1><pre>'
            go tool -modfile=tools/go.mod benchstat old.txt new.txt 2>/dev/null || echo "benchstat comparison failed"
            echo '</pre></body></html>'
          } > bench-comparison.html

      - name: Check for regressions (>10%)
        run: |
          mkdir -p bench-regression
          go tool -modfile=tools/go.mod benchstat -format csv old.txt new.txt \
            > bench-regression/bench-csv.txt \
            2> bench-regression/benchstat-notes.txt
          awk -F, '
            BEGIN {
              critical = "^(ManagerDemux1000Sessions|ManagerLookup1000Sessions|FullRecvPath|FullRecvPathCodec|"
              critical = critical "FullTxPath|SessionRecvPacket|ControlPacketMarshal|ControlPacketUnmarshal|"
              critical = critical "ControlPacketRoundTrip|BuildInnerPacket|StripInnerPacket|VXLANHeaderMarshal|"
              critical = critical "VXLANHeaderUnmarshal|GeneveHeaderMarshal|GeneveHeaderUnmarshal)-"
            }
            $2 == "sec/op" { metric = "sec/op"; next }
            $2 == "B/op" || $2 == "allocs/op" { metric = $2; next }
            metric == "sec/op" && $6 ~ /^\+[0-9.]+%/ {
              pct = $6
              gsub(/[+%]/, "", pct)
              if (pct + 0 < 10) {
                next
              }
              if ($1 ~ critical && (($2 + 0) >= 0.0000001 || ($4 + 0) >= 0.0000001)) {
                print $1 "," $6 "," $7 >> "bench-regression/critical-regressions.csv"
              } else if (($2 + 0) >= 0.000000001 || ($4 + 0) >= 0.000000001) {
                print $1 "," $6 "," $7 >> "bench-regression/reported-regressions.csv"
              } else {
                next
              }
            }
          ' bench-regression/bench-csv.txt

          if [ -s bench-regression/reported-regressions.csv ]; then
            {
              echo "### Report-only benchmark regressions"
              echo ""
              echo "| Benchmark | Delta | Significance |"
              echo "| --- | ---: | --- |"
              awk -F, '{ printf "| `%s` | %s | %s |\n", $1, $2, $3 }' bench-regression/reported-regressions.csv
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -s bench-regression/benchstat-notes.txt ]; then
            {
              echo "### benchstat notes"
              echo ""
              echo '```'
              cat bench-regression/benchstat-notes.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -s bench-regression/critical-regressions.csv ]; then
            echo "::warning::Critical benchmark regression detected (>10%). Review bench-report.md."
            cat bench-regression/critical-regressions.csv
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-reports
          path: |
            old.txt
            new.txt
            bench-report.md
            bench-comparison.html
          retention-days: 30

      - name: Post benchmark comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- benchmark-report -->';
            const body = marker + '\n' + fs.readFileSync('bench-report.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    needs: [build-and-test, lint-go, lint-docs, vulnerability-check, buf]
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy
