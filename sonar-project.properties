sonar.projectKey=dantte-lp_gobfd
sonar.organization=dantte-lp

# Go coverage report
sonar.go.coverage.reportPaths=coverage.out

# Exclude command entry points and host-network integration boundaries from
# unit coverage. These files are validated by build, lint, security, and
# system/container checks.
sonar.coverage.exclusions=\
  cmd/**,\
  internal/netio/ifmon_linux.go,\
  internal/netio/ifmon_other.go,\
  internal/netio/listener_linux.go,\
  internal/netio/listener_other.go,\
  internal/netio/lag_backend.go,\
  internal/netio/lag_networkmanager.go,\
  internal/netio/lag_ovsdb.go,\
  internal/netio/rawsock_other.go

# RFC 5880 Sections 6.7.3 and 6.7.4 require the keyed MD5 and keyed SHA1
# algorithms implemented in this file. Keep the exception scoped to the exact
# rule and protocol implementation; all other weak-hash findings remain active.
sonar.issue.ignore.multicriteria=rfc5880Auth
sonar.issue.ignore.multicriteria.rfc5880Auth.ruleKey=go:S4790
sonar.issue.ignore.multicriteria.rfc5880Auth.resourceKey=internal/bfd/auth.go

# Exclude from analysis (generated, tests, infra, docs)
sonar.exclusions=\
  pkg/bfdpb/**,\
  **/*_test.go,\
  test/**,\
  deployments/**,\
  docs/**,\
  bench/**,\
  scripts/**
