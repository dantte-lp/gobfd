name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum', 'tools/go.sum', 'tools/gopls/go.sum', 'tools/syft/go.sum', 'tools/goreleaser/qualified.sum', 'tools/goreleaser/source.sum', 'tools/goreleaser/refmt.sum') }}

      - name: Build
        run: go run ./test/cmd/cictl release-build

      - name: Install test tools
        run: go run ./test/cmd/toolbootstrap podman-runtime

      - name: Test
        run: go test -buildvcs=false ./... -race -count=1

      - name: Vulnerability Audit
        run: go run ./scripts/vuln-audit.go

      - name: Publisher vulnerability audit
        run: go run ./test/cmd/cictl publisher-audit

      - name: Upload publisher security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publisher-security-reports
          path: reports/security/publisher-audit/
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: docker.io/library/golang:1.27.3-trixie@sha256:604106102d33b1084e37ca08adf98ac0813624ae8595bd0d7f3965ecebded09c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum', 'tools/go.sum', 'tools/gopls/go.sum', 'tools/syft/go.sum', 'tools/goreleaser/qualified.sum', 'tools/goreleaser/source.sum', 'tools/goreleaser/refmt.sum') }}

      - name: Lint
        run: go run ./test/cmd/cictl lint

  reports:
    runs-on: ubuntu-latest
    needs: [test, lint]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum', 'tools/go.sum', 'tools/gopls/go.sum', 'tools/syft/go.sum', 'tools/goreleaser/qualified.sum', 'tools/goreleaser/source.sum', 'tools/goreleaser/refmt.sum') }}

      - name: Install report tools
        run: go run ./test/cmd/toolbootstrap podman-runtime

      - name: Run tests with JUnit output
        run: go run ./test/cmd/cictl release-test-report

      - name: Run benchmarks
        run: go run ./test/cmd/cictl release-benchmarks

      - name: Generate benchmark metadata
        run: go run ./test/cmd/cictl release-benchmark-metadata

      - name: Compare with baseline
        run: go run ./test/cmd/cictl release-benchmark-comparison

      - name: Create reports archive
        run: go run ./test/cmd/cictl release-reports-archive

      - name: Upload reports archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-reports
          path: gobfd-*-reports.tar.gz
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [test, lint, reports]
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Hosted VM teardown bounds prestart orphans and bind outputs after abrupt CLI death.
      - name: Compile Syft controller in pinned Go image
        run: >-
          docker run --rm --name gobfd-cictl-${{ github.run_id }}-${{ github.run_attempt }}
          --user=0:0 --read-only --cap-drop=ALL --cap-add=DAC_OVERRIDE --security-opt=no-new-privileges
          --cpus=2 --memory=3221225472 --memory-swap=3221225472 --pids-limit=512
          --workdir /src --entrypoint /usr/bin/timeout
          --tmpfs /tmp:rw,nosuid,nodev,size=1073741824,mode=1777
          --tmpfs /cache:rw,nosuid,nodev,size=1073741824,mode=0700
          --mount "type=bind,src=${{ github.workspace }},dst=/src,readonly"
          --mount "type=bind,src=${{ runner.temp }},dst=/out"
          --env CGO_ENABLED=0 --env GOTOOLCHAIN=local --env GOENV=off --env GOWORK=off
          --env GOCACHE=/cache/build --env GOMODCACHE=/cache/mod --env GOPATH=/cache/go
          --env HOME=/cache --env TMPDIR=/tmp --env GOMAXPROCS=2 --env GOMEMLIMIT=2GiB
          docker.io/library/golang:1.27.3-trixie@sha256:604106102d33b1084e37ca08adf98ac0813624ae8595bd0d7f3965ecebded09c
          --signal=TERM --kill-after=5s 600s /usr/local/go/bin/go build
          -trimpath -mod=readonly -buildvcs=false
          -o /out/gobfd-cictl-${{ github.run_id }}-${{ github.run_attempt }} ./test/cmd/cictl

      - name: Install source-built release tools in pinned Go image
        run: '"${{ runner.temp }}/gobfd-cictl-${{ github.run_id }}-${{ github.run_attempt }}" release-source-tools --compiler-container'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Refuse existing release, draft, or versioned OCI tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./test/cmd/cictl release-preflight

      - name: Extract release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./test/cmd/cictl release-notes

      - name: Verify merged release PR and bind its URL to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./test/cmd/cictl release-pr-check

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify UPX prerequisite
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./test/cmd/cictl release-upx

      - name: Run GoReleaser
        run: goreleaser release --clean --parallelism=1 --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize shellless packages
        run: go -C tools run ./cmd/packagefinalize

      - name: Checkout immutable release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-verifier
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Record exact release asset matrix
        working-directory: .release-verifier
        env:
          RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}
        run: go run ./test/cmd/cictl release-artifacts

      - name: Upload exact release asset matrix
        working-directory: .release-verifier
        env:
          RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./test/cmd/cictl release-assets-upload

      - name: Record exact release OCI evidence
        working-directory: .release-verifier
        env:
          RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}
        run: go run ./test/cmd/cictl release-oci-evidence

      - name: Download reports archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-reports

      - name: Attach reports to release
        working-directory: .release-verifier
        env:
          RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./test/cmd/cictl release-evidence

      - name: Verify exact release draft
        working-directory: .release-verifier
        env:
          RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./test/cmd/cictl release-verify

      - name: Promote verified OCI aliases
        if: ${{ !contains(github.ref_name, '-') }}
        working-directory: .release-verifier
        env:
          RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./test/cmd/cictl release-promote

      - name: Publish verified release
        working-directory: .release-verifier
        env:
          RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./test/cmd/cictl release-publish
