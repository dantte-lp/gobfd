# Opt-in drop-in for micro_bfd.actuator backend "kernel-bond" in enforce mode.
# Install as /etc/systemd/system/gobfd.service.d/kernel-bond.conf, replace
# bond0 with the actuated LAG interface (one ReadWritePaths= line per bond),
# then run systemctl daemon-reload and restart gobfd.
#
# ProtectKernelTunables=true keeps /sys read-only. The backend writes only
# /sys/class/net/<bond>/bonding/slaves; ReadWritePaths= reopens that one file
# through its /sys/devices/virtual/net path. The bond must exist when gobfd
# starts.
#
# sysfs network attributes are owned by root:root with mode 0644, so the gobfd
# user also needs CAP_DAC_OVERRIDE beside CAP_NET_ADMIN to open the file for
# writing. CAP_DAC_OVERRIDE bypasses file permission checks on every path the
# service can see: it can then read root-only files such as /etc/shadow, and
# it can write wherever the mount namespace allows (RuntimeDirectory=, the
# private /tmp and this file). Use this drop-in only where that trade-off is
# accepted. Write qualification on a host with the bonding module is pending
# (gobfd-qj0.8.2.3.3.1).
[Service]
ReadWritePaths=/sys/devices/virtual/net/bond0/bonding/slaves
CapabilityBoundingSet=CAP_DAC_OVERRIDE
AmbientCapabilities=CAP_DAC_OVERRIDE
