name: CI

on:
  push:
    branches: [master, main, "release/v*"]
  pull_request:
    branches: [master, main, "release/v*"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum', 'tools/go.sum', 'tools/gopls/go.sum', 'tools/syft/go.sum', 'tools/goreleaser/qualified.sum', 'tools/goreleaser/source.sum', 'tools/goreleaser/refmt.sum') }}

      - name: Build
        run: go run ./test/cmd/cictl build --output /tmp/gobfd-build

      - name: Install test tools
        run: go run ./test/cmd/toolbootstrap podman-runtime

      - name: Test with coverage
        run: go run ./test/cmd/cictl test-coverage

      - name: Generate HTML test report
        if: always()
        run: go run ./test/cmd/junitreport --root . --input unit-report.xml --output unit-report.html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            unit-report.xml
            unit-report.json
            unit-report.html
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  release-source-prerequisites:
    name: Release source prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Hosted VM teardown bounds prestart orphans and bind outputs after abrupt CLI death.
      - name: Compile Syft controller in pinned Go image
        run: >-
          docker run --rm --name gobfd-cictl-${{ github.run_id }}-${{ github.run_attempt }}
          --user=0:0 --read-only --cap-drop=ALL --cap-add=DAC_OVERRIDE --security-opt=no-new-privileges
          --cpus=2 --memory=3221225472 --memory-swap=3221225472 --pids-limit=512
          --workdir /src --entrypoint /usr/bin/timeout
          --tmpfs /tmp:rw,nosuid,nodev,size=1073741824,mode=1777
          --tmpfs /cache:rw,nosuid,nodev,size=1073741824,mode=0700
          --mount "type=bind,src=${{ github.workspace }},dst=/src,readonly"
          --mount "type=bind,src=${{ runner.temp }},dst=/out"
          --env CGO_ENABLED=0 --env GOTOOLCHAIN=local --env GOENV=off --env GOWORK=off
          --env GOCACHE=/cache/build --env GOMODCACHE=/cache/mod --env GOPATH=/cache/go
          --env HOME=/cache --env TMPDIR=/tmp --env GOMAXPROCS=2 --env GOMEMLIMIT=2GiB
          docker.io/library/golang:1.27.3-trixie@sha256:604106102d33b1084e37ca08adf98ac0813624ae8595bd0d7f3965ecebded09c
          --signal=TERM --kill-after=5s 600s /usr/local/go/bin/go build
          -trimpath -mod=readonly -buildvcs=false
          -o /out/gobfd-cictl-${{ github.run_id }}-${{ github.run_attempt }} ./test/cmd/cictl

      - name: Install source-built release tools in pinned Go image
        run: '"${{ runner.temp }}/gobfd-cictl-${{ github.run_id }}-${{ github.run_attempt }}" release-source-tools --compiler-container'

      - name: Check source-built GoReleaser configuration
        run: goreleaser check

      - name: Test RPM publication metadata
        run: >-
          docker run --rm --name gobfd-packagefinalize-${{ github.run_id }}-${{ github.run_attempt }}
          --user=0:0 --read-only --cap-drop=ALL --security-opt=no-new-privileges
          --cpus=2 --memory=3221225472 --memory-swap=3221225472 --pids-limit=512
          --workdir /src --entrypoint /usr/bin/timeout
          --tmpfs /tmp:rw,nosuid,nodev,size=1073741824,mode=1777
          --tmpfs /cache:rw,nosuid,nodev,size=1073741824,mode=0700
          --mount "type=bind,src=${{ github.workspace }},dst=/src,readonly"
          --env CGO_ENABLED=1 --env GOTOOLCHAIN=local --env GOENV=off --env GOWORK=off
          --env GOCACHE=/cache/build --env GOMODCACHE=/cache/mod --env GOPATH=/cache/go
          --env HOME=/cache --env TMPDIR=/tmp --env GOMAXPROCS=2 --env GOMEMLIMIT=2GiB
          docker.io/library/golang:1.27.3-trixie@sha256:604106102d33b1084e37ca08adf98ac0813624ae8595bd0d7f3965ecebded09c
          --signal=TERM --kill-after=5s 600s /usr/local/go/bin/go -C tools
          test -race -count=1 -mod=readonly -buildvcs=false -p=2 ./cmd/packagefinalize

  non-linux-contract:
    name: Non-Linux transport contract
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Test the non-Linux transport boundary
        run: go test ./internal/netio -race -count=1

      - name: Test unsupported management operations
        run: >-
          go test -race -count=1
          -run '^(TestUnixPeerUIDRejectsUnsupportedPlatform|TestRenewFileRejectsUnsupportedPlatform|TestRenewFilePreservesCancellationOnUnsupportedPlatform|TestConnContextAttachesUnixPeerPrincipal)$'
          ./internal/server ./internal/stepca

      - name: Cross-compile all packages without cgo
        env:
          CGO_ENABLED: "0"
        run: go build ./...

  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/golang:1.27.3-trixie@sha256:604106102d33b1084e37ca08adf98ac0813624ae8595bd0d7f3965ecebded09c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum', 'tools/go.sum', 'tools/gopls/go.sum', 'tools/syft/go.sum', 'tools/goreleaser/qualified.sum', 'tools/goreleaser/source.sum', 'tools/goreleaser/refmt.sum') }}

      - name: golangci-lint v2
        run: go run ./test/cmd/cictl lint

  lint-docs:
    name: Lint (docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Markdown policy
        run: go run ./test/cmd/repoquality markdown --root .

      - name: YAML policy
        run: go tool -modfile=tools/go.mod yamlfmt -lint .

      - name: Spelling policy
        run: >-
          go tool -modfile=tools/go.mod misspell -error
          README.md CONTRIBUTING.md CODE_OF_CONDUCT.md SUPPORT.md
          GOVERNANCE.md MAINTAINERS.md CHANGELOG.md docs/en/roadmap.md

  commit-policy:
    name: Commit policy (PR title)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: go run ./test/cmd/cictl commit-policy

  vulnerability-check:
    name: Vulnerability audit
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/golang:1.27.3-trixie@sha256:604106102d33b1084e37ca08adf98ac0813624ae8595bd0d7f3965ecebded09c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum', 'tools/go.sum', 'tools/gopls/go.sum', 'tools/syft/go.sum', 'tools/goreleaser/qualified.sum', 'tools/goreleaser/source.sum', 'tools/goreleaser/refmt.sum') }}

      - name: Vulnerability Audit
        run: go run ./scripts/vuln-audit.go --report-dir reports/security

      - name: Publisher vulnerability audit
        run: go run ./test/cmd/cictl publisher-audit

      - name: Generate separate runtime, tools, gopls, and Syft SBOMs
        if: always()
        run: go run ./test/cmd/cictl sbom --report-dir reports/security

      - name: Upload dependency security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-security-reports
          path: reports/security/
          retention-days: 30

  buf:
    name: Buf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Set up buf
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true

      - name: buf lint
        run: buf lint

      - name: Verify generated protobuf code
        run: go run ./test/cmd/cictl proto-verify

      - name: Fetch base branch for buf breaking
        if: github.event_name == 'pull_request'
        run: go run ./test/cmd/cictl buf-fetch-base

      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: go run ./test/cmd/cictl buf-breaking

  benchmark:
    name: Benchmark comparison
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      BENCH_REGEX: >-
        ^(BenchmarkControlPacket|BenchmarkFSMTransition|BenchmarkApplyJitter|BenchmarkPacketPool|BenchmarkRecvStateToEvent|BenchmarkFullRecvPath|BenchmarkFullRecvPathCodec|BenchmarkFullTxPath|BenchmarkManager(Demux|Lookup)1000Sessions|BenchmarkRecvDecodeLookupEnqueue|BenchmarkRecvDecodeFSM|BenchmarkTxMarshalJitter|BenchmarkSessionRecvPacket|BenchmarkDetectionTimeCalc|BenchmarkCalcTxInterval|BenchmarkDetectionTimeCalcHot|BenchmarkCalcTxIntervalHot|BenchmarkSessionApplyJitter|BenchmarkBuildInnerPacket|BenchmarkStripInnerPacket|BenchmarkVXLANHeader|BenchmarkGeneveHeader)
    container:
      image: docker.io/library/golang:1.27.3-trixie@sha256:604106102d33b1084e37ca08adf98ac0813624ae8595bd0d7f3965ecebded09c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum', 'tools/go.sum', 'tools/gopls/go.sum', 'tools/syft/go.sum', 'tools/goreleaser/qualified.sum', 'tools/goreleaser/source.sum', 'tools/goreleaser/refmt.sum') }}

      - name: Run paired benchmarks (base and PR)
        run: go run ./test/cmd/cictl benchmark-pair --old old.txt --new new.txt

      - name: Normalize renamed benchmarks and validate inputs
        run: go run ./test/cmd/cictl benchmark-normalize --old old.txt --new new.txt

      - name: Compare benchmarks
        run: go run ./test/cmd/cictl benchmark-report

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-reports
          path: |
            old.txt
            new.txt
            bench-report.md
            bench-comparison.html
            bench-comparison.json
            bench-regression/bench-csv.txt
            bench-regression/benchstat-notes.txt
          retention-days: 30

      - name: Post benchmark comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- benchmark-report -->';
            const body = marker + '\n' + fs.readFileSync('bench-report.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    needs: [build-and-test, lint-go, lint-docs, vulnerability-check, buf]
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-results.sarif
          exit-code: "1"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy
