name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Build
        run: go run ./test/cmd/cictl release-build

      - name: Install test tools
        run: go run ./test/cmd/toolbootstrap podman-runtime

      - name: Test
        run: go test -buildvcs=false ./... -race -count=1

      - name: Vulnerability Audit
        run: go run ./scripts/vuln-audit.go

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: docker.io/library/golang:1.27.0-trixie@sha256:ae28539d2ef595b9a2930dd7f031d9592376829dc0eae7cb869559f7d5812c3a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Lint
        run: go run ./test/cmd/cictl lint

  reports:
    runs-on: ubuntu-latest
    needs: [test, lint]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install report tools
        run: go run ./test/cmd/toolbootstrap podman-runtime

      - name: Run tests with JUnit output
        run: go run ./test/cmd/cictl release-test-report

      - name: Run benchmarks
        run: go run ./test/cmd/cictl release-benchmarks

      - name: Generate benchmark metadata
        run: go run ./test/cmd/cictl release-benchmark-metadata

      - name: Compare with baseline
        run: go run ./test/cmd/cictl release-benchmark-comparison

      - name: Create reports archive
        run: go run ./test/cmd/cictl release-reports-archive

      - name: Upload reports archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reports
          path: gobfd-*-reports.tar.gz
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    needs: [test, lint, reports]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"

      - name: Refuse existing release, draft, or versioned OCI tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./test/cmd/cictl release-preflight

      - name: Extract release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./test/cmd/cictl release-notes

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      - name: Verify UPX prerequisite
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./test/cmd/cictl release-upx

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean --parallelism=1 --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout immutable release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-verifier
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Record exact release asset matrix
        working-directory: .release-verifier
        env:
          RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}
        run: go run ./test/cmd/cictl release-artifacts

      - name: Record exact release OCI evidence
        working-directory: .release-verifier
        env:
          RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}
        run: go run ./test/cmd/cictl release-oci-evidence

      - name: Download reports archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-reports

      - name: Attach reports to release
        working-directory: .release-verifier
        env:
          RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./test/cmd/cictl release-evidence

      - name: Verify exact release draft
        working-directory: .release-verifier
        env:
          RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./test/cmd/cictl release-verify

      - name: Promote verified OCI aliases
        working-directory: .release-verifier
        env:
          RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./test/cmd/cictl release-promote

      - name: Publish verified release
        working-directory: .release-verifier
        env:
          RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./test/cmd/cictl release-publish
