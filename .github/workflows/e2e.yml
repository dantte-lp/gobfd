name: E2E Evidence

on:
  pull_request:
    branches: [master, main, "release/v*"]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: E2E evidence profile
        required: true
        default: pr-safe
        type: choice
        options:
          - pr-safe
          - nightly
          - vendor

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.profile || github.event_name }}
  cancel-in-progress: true

jobs:
  pr-safe:
    name: PR-safe E2E
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'pr-safe')
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Prepare E2E Podman runtime
        run: go run ./test/cmd/toolbootstrap podman-e2e

      - name: Start dev stack
        run: make up

      - name: Run core E2E
        run: make e2e-core

      - name: Run four-peer testcontainers migration gate
        run: make interop-testcontainers

      - name: Run BGP+BFD testcontainers migration gate
        run: make interop-bgp-testcontainers

      - name: Run RFC testcontainers migration gate
        run: make interop-rfc-testcontainers

      - name: Run overlay E2E
        run: make e2e-overlay

      - name: Stop dev stack
        if: always()
        continue-on-error: true
        run: make down

      - name: Report AppArmor denials
        if: always()
        continue-on-error: true
        run: go run ./test/cmd/toolbootstrap apparmor-denials

      - name: Upload PR-safe E2E artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-pr-safe
          path: reports/e2e/**
          if-no-files-found: warn
          retention-days: 30

  nightly:
    name: Nightly E2E
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    if: >-
      ${{
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'nightly')
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Prepare E2E Podman runtime
        run: go run ./test/cmd/toolbootstrap podman-e2e

      - name: Start dev stack
        run: make up

      - name: Run routing E2E
        run: make e2e-routing

      - name: Run RFC E2E
        run: make e2e-rfc

      - name: Run Linux dataplane E2E
        run: make e2e-linux

      # GoReleaser DEB under systemd 257 on Debian 13; RPM build checks remain separate.
      # Evidence lands in reports/e2e/package-lifecycle.
      - name: Build DEB and RPM packages
        run: go run ./test/cmd/cictl package-build

      - name: Run DEB systemd lifecycle test
        run: go run ./test/cmd/cictl package-lifecycle

      - name: Stop dev stack
        if: always()
        continue-on-error: true
        run: make down

      - name: Report AppArmor denials
        if: always()
        continue-on-error: true
        run: go run ./test/cmd/toolbootstrap apparmor-denials

      - name: Upload nightly E2E artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-nightly
          path: reports/e2e/**
          if-no-files-found: warn
          retention-days: 30

  vendor:
    name: Manual vendor E2E
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'vendor' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Prepare E2E Podman runtime
        run: go run ./test/cmd/toolbootstrap podman-e2e

      - name: Start dev stack
        run: make up

      - name: Run vendor profile evidence
        run: make e2e-vendor

      - name: Stop dev stack
        if: always()
        continue-on-error: true
        run: make down

      - name: Report AppArmor denials
        if: always()
        continue-on-error: true
        run: go run ./test/cmd/toolbootstrap apparmor-denials

      - name: Upload vendor E2E artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-vendor
          path: reports/e2e/**
          if-no-files-found: warn
          retention-days: 30
