# Interoperability test stack: GoBFD <-> FRR <-> BIRD3 <-> Holo <-> Thoro/bfd
#
# All containers share a custom bridge network (172.20.0.0/24)
# with static IP assignments:
#   - gobfd:   172.20.0.10  (tshark shares this network namespace)
#   - frr:     172.20.0.20
#   - bird3:   172.20.0.30
#   - scapy:   172.20.0.40  (BFD protocol fuzzer, runs once and exits)
#   - holo:    172.20.0.50  (Holo BFD peer, no auth)
#   - thoro:   172.20.0.60  (Go BFD peer, no auth — auth verify not implemented)
#
# BFD single-hop sessions are established between gobfd and each peer.
# RFC 5881: destination port 3784, source port 49152-65535, TTL=255.
#
# tshark captures all BFD traffic to /captures/ for offline analysis.
# Live decode:  podman exec tshark-interop tshark -r /captures/bfd.pcapng -V -Y bfd
# Live capture: podman exec tshark-interop tshark -i any -f "udp port 3784" -V
#
# Usage (project ownership and cleanup are enforced by projectctl.sh):
#   make interop
#   make interop-up
#   make interop-logs
#   make interop-down

services:
  gobfd:
    build:
      context: ../..
      dockerfile: deployments/docker/Containerfile
    container_name: gobfd-interop
    user: "0:0"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./gobfd/gobfd.yml:/etc/gobfd/gobfd.yml:ro,z
    command: ["-config", "/etc/gobfd/gobfd.yml"]
    depends_on:
      holo-config:
        condition: service_completed_successfully
    networks:
      bfdnet:
        ipv4_address: 172.20.0.10

  frr:
    image: quay.io/frrouting/frr:10.2.5
    container_name: frr-interop
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - ./frr/daemons:/etc/frr/daemons:ro,z
      - ./frr/frr.conf:/etc/frr/frr.conf:ro,z
    networks:
      bfdnet:
        ipv4_address: 172.20.0.20

  bird3:
    build:
      context: ./bird3
      dockerfile: Containerfile
    container_name: bird3-interop
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./bird3/bird.conf:/etc/bird/bird.conf:ro,z
    networks:
      bfdnet:
        ipv4_address: 172.20.0.30

  tshark:
    build:
      context: ./tshark
      dockerfile: Containerfile
    container_name: tshark-interop
    network_mode: "service:gobfd"
    depends_on:
      - gobfd
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - captures:/captures:z

  holo:
    image: ghcr.io/holo-routing/holo-bundle@sha256:5c1f61475b1623b3eab611921f8319fb0a10492ced3f7da05e656418abb5ca4a
    container_name: holo-interop
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./holo/holod.toml:/etc/holod.toml:ro,z
    networks:
      bfdnet:
        ipv4_address: 172.20.0.50
    healthcheck:
      test: ["CMD-SHELL", "netstat -ltn | grep -q ':50051 '"]
      interval: 1s
      timeout: 1s
      retries: 15
      start_period: 2s

  holo-config:
    image: ghcr.io/holo-routing/holo-bundle@sha256:5c1f61475b1623b3eab611921f8319fb0a10492ced3f7da05e656418abb5ca4a
    container_name: holo-config-interop
    volumes:
      - ./holo/holo.startup:/etc/holo.startup:ro,z
    depends_on:
      holo:
        condition: service_healthy
    entrypoint: holo-cli
    command: ["--address", "http://holo:50051", "--file", "/etc/holo.startup"]
    networks:
      bfdnet:

  thoro:
    build:
      context: ./thoro
      dockerfile: Containerfile
    container_name: thoro-interop
    depends_on:
      - gobfd
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./thoro/config.yaml:/etc/bfdd/config.yaml:ro,z
    networks:
      bfdnet:
        ipv4_address: 172.20.0.60

  scapy:
    build:
      context: ./scapy
      dockerfile: Containerfile
    container_name: scapy-interop
    depends_on:
      - gobfd
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      GOBFD_IP: "172.20.0.10"
    networks:
      bfdnet:
        ipv4_address: 172.20.0.40
    profiles:
      - fuzz

volumes:
  captures:

networks:
  bfdnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
