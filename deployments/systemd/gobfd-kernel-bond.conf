# Opt-in drop-in for micro_bfd.actuator backend "kernel-bond" in enforce mode.
# Install as /etc/systemd/system/gobfd.service.d/kernel-bond.conf, replace
# bond0 with the actuated LAG interface (one line per bond), then run
# systemctl daemon-reload and restart gobfd.
#
# ProtectKernelTunables=true keeps /sys read-only. The backend writes only
# /sys/class/net/<bond>/bonding/slaves; this reopens that one file through its
# /sys/devices/virtual/net path. The bond must exist when gobfd starts.
# Write qualification on a host with the bonding module is pending
# (gobfd-qj0.8.2.3.3.1).
[Service]
ReadWritePaths=/sys/devices/virtual/net/bond0/bonding/slaves
